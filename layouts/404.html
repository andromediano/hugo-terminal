{{ define "main" }}
<div class="max-w-2xl mx-auto px-4 py-24 text-center">
  <div class="terminal-card p-8">
    <div class="terminal-dots mb-6">
      <span></span><span></span><span></span>
    </div>

    <div class="font-mono">
      <p class="text-slate-500 text-sm mb-4">$ cat /404</p>
      <h1 class="text-6xl font-bold text-slate-700 mb-4">404</h1>
      <p class="text-primary-500 text-lg mb-2">Error: Page not found</p>
      <p class="text-slate-500 text-sm mb-8">The requested resource could not be located.</p>

      <a href="{{ .Site.BaseURL }}"
         class="inline-flex items-center gap-2 px-4 py-2 text-sm text-primary-400 bg-primary-500/10 border border-primary-500/30 rounded hover:bg-primary-500/20 transition-colors">
        <span>$</span> cd ~/home
      </a>
    </div>
  </div>
</div>
{{ end }}
