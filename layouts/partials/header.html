<!-- Navigation -->
<header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14">
      <!-- Logo -->
      <a href="{{ .Site.BaseURL }}" class="flex items-center gap-3 group">
        <span class="text-primary-500 text-lg">&gt;_</span>
        <span class="text-lg font-semibold text-slate-100 group-hover:text-primary-400 transition-colors">
          {{ .Site.Title }}
        </span>
        <span class="hidden sm:inline-block w-2 h-5 bg-primary-500 animate-pulse"></span>
      </a>

      <!-- Navigation Links -->
      <nav class="hidden md:flex items-center gap-6">
        {{ range .Site.Menus.main.ByWeight }}
        <a href="{{ .URL }}" class="text-slate-400 hover:text-primary-400 text-sm transition-colors">
          ./{{ .Name | lower }}
        </a>
        {{ end }}
      </nav>

      <!-- Status -->
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-2 text-xs text-slate-500">
          <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
          <span>online</span>
        </div>

        <!-- Mobile Menu Button -->
        <button type="button" class="md:hidden p-2 rounded text-slate-400 hover:text-primary-400 hover:bg-slate-800"
          onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-slate-800 bg-slate-900">
    <nav class="px-4 py-3 space-y-1">
      {{ range .Site.Menus.main.ByWeight }}
      <a href="{{ .URL }}" class="block py-2 text-slate-400 hover:text-primary-400 text-sm">
        $ cd ./{{ .Name | lower }}
      </a>
      {{ end }}
    </nav>
  </div>
</header>

<!-- Breadcrumb -->
{{ if not .IsHome }}
<nav class="bg-slate-800/50 border-b border-slate-800" aria-label="Breadcrumb">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-2">
    <div class="flex items-center gap-1 text-xs text-slate-500 font-mono">
      <span class="text-primary-500">~</span>
      {{ range .Ancestors.Reverse }}
      <span class="text-slate-600">/</span>
      <a href="{{ .Permalink }}" class="hover:text-primary-400">{{ .Title }}</a>
      {{ end }}
      <span class="text-slate-600">/</span>
      <span class="text-slate-300">{{ .Title | truncate 30 }}</span>
    </div>
  </div>
</nav>
{{ end }}
